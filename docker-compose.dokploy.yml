# Dokploy stack — db + migrate + api + web, no published ports.
#
# Routing lives in the Traefik labels below, not in Dokploy's Domains tab —
# a domain added there is a second router for the same host, and whichever wins
# takes the whole site with it. Leave that tab empty. See DEPLOY.md.
#
# Publishing host ports here would expose Postgres and the API on the VPS's
# public interface, bypassing Traefik entirely.
#
# Every variable comes from the stack's Environment tab in Dokploy, which is
# written to .env next to this file before `docker compose up`.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pokedraft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pokedraft}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pokedraft} -d ${POSTGRES_DB:-pokedraft}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Runs migrations, then exits. The api waits for it to succeed, so a bad
  # migration fails the deploy instead of crash-looping the server.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["bun", "run", "db:migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      # Origin only, no path: Better Auth appends its own /api/auth basePath and
      # matches incoming requests against the result. A path here would make it
      # expect that path twice and answer 404 to every auth call.
      BETTER_AUTH_URL: https://${APP_DOMAIN}
      # The single origin allowed to send credentials. Same host as the API here,
      # so requests are first-party and CORS never comes into play.
      WEB_ORIGIN: https://${APP_DOMAIN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bun", "--eval", "const r = await fetch('http://localhost:3000/health'); if (!r.ok) process.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - default
      - dokploy-network
    labels:
      # One host, two routers. `/api/*` wins on priority and is stripped before
      # it reaches Elysia, which serves its routes at the root.
      #
      # The client's auth calls therefore arrive as /api/api/auth/* and land on
      # Better Auth's /api/auth/* after the strip. That doubling is deliberate:
      # the outer /api routes to this service, the inner one is Better Auth's
      # own basePath.
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.pokedraft-api.rule=Host(`${APP_DOMAIN:?set APP_DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.pokedraft-api.entrypoints=websecure
      - traefik.http.routers.pokedraft-api.tls.certresolver=letsencrypt
      - traefik.http.routers.pokedraft-api.priority=2000
      - traefik.http.routers.pokedraft-api.service=pokedraft-api
      - traefik.http.routers.pokedraft-api.middlewares=pokedraft-api-strip
      - traefik.http.middlewares.pokedraft-api-strip.stripprefix.prefixes=/api
      - traefik.http.services.pokedraft-api.loadbalancer.server.port=3000
      # /api/auth/* passes through unstripped, because that is Better Auth's own
      # path. Only OAuth callbacks arrive here — the browser's own auth calls go
      # through the stripped router above — but a redirect from Discord or
      # Google lands on exactly this URL and must not be rewritten.
      - traefik.http.routers.pokedraft-auth.rule=Host(`${APP_DOMAIN:?set APP_DOMAIN}`) && PathPrefix(`/api/auth`)
      - traefik.http.routers.pokedraft-auth.entrypoints=websecure
      - traefik.http.routers.pokedraft-auth.tls.certresolver=letsencrypt
      - traefik.http.routers.pokedraft-auth.priority=3000
      - traefik.http.routers.pokedraft-auth.service=pokedraft-api

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the client bundle at build time, so changing the domain
        # means a rebuild, not a restart. The websocket URL is derived from it.
        VITE_API_URL: https://${APP_DOMAIN:?set APP_DOMAIN}/api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5173
    expose:
      - "5173"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - default
      - dokploy-network
    labels:
      # Catch-all: everything the API router didn't claim. Lower priority, so
      # /api never reaches the SSR server.
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.pokedraft-web.rule=Host(`${APP_DOMAIN:?set APP_DOMAIN}`)
      - traefik.http.routers.pokedraft-web.entrypoints=websecure
      - traefik.http.routers.pokedraft-web.tls.certresolver=letsencrypt
      - traefik.http.routers.pokedraft-web.priority=1000
      - traefik.http.routers.pokedraft-web.service=pokedraft-web
      - traefik.http.services.pokedraft-web.loadbalancer.server.port=5173
      # Plain http exists only to redirect. ACME's own router outranks this one,
      # so the certificate challenge still gets through.
      - traefik.http.routers.pokedraft-http.rule=Host(`${APP_DOMAIN:?set APP_DOMAIN}`)
      - traefik.http.routers.pokedraft-http.entrypoints=web
      - traefik.http.routers.pokedraft-http.priority=1000
      - traefik.http.routers.pokedraft-http.service=pokedraft-web
      - traefik.http.routers.pokedraft-http.middlewares=pokedraft-https
      - traefik.http.middlewares.pokedraft-https.redirectscheme.scheme=https
      - traefik.http.middlewares.pokedraft-https.redirectscheme.permanent=true

volumes:
  pgdata:

networks:
  # Created by Dokploy on install. Traefik lives here; the db deliberately
  # does not.
  dokploy-network:
    external: true
